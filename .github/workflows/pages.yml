# Signal Tower 公開展示版：從 OKX 抓資料、重跑引擎，有新的 4H K 線才發布到 GitHub Pages。
# 準時觸發靠外部排程（cron-job.org 呼叫 workflow_dispatch，每根 4H 收盤後 2 分鐘）；
# GitHub 內建排程常延遲、整次跳過，只留作備援（每 15 分鐘嘗試，沒有新 K 線就不發布）。
# 操作指令紀錄（signals_log.csv）存在私人 repo btc-backtest-state：執行前取回到 paper/state/，有新指令才提交推回。
# 用部署金鑰（secret STATE_DEPLOY_KEY，只有那個 repo 的寫入權限）；取回或推送失敗時網站照常發布，但整次執行標為失敗。
name: 更新並發布 Signal Tower

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["paper/**", "backtest.py", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      log_saved: ${{ steps.save.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install pandas==3.0.6 numpy==2.5.4
      - name: 還原 K 線快取（只需補抓最新幾根）
        uses: actions/cache@v4
        with:
          path: paper/data
          key: okx-btc-4h-${{ github.run_id }}
          restore-keys: okx-btc-4h-
      - name: 取回操作指令紀錄（私人 repo）
        id: state
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/btc-backtest-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: paper/state
          fetch-depth: 0
      - name: 抓資料並重算（有新 K 線且有要操作的指令時推播到手機）
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python paper/engine.py --no-notify
      - name: 和線上版本比對，有新 K 線才發布
        id: check
        env:
          LIVE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.js
        run: |
          bar() { python -c "import sys,json; print(json.loads(sys.stdin.read().split('=',1)[1].rstrip().rstrip(';'))['meta']['last_bar'])"; }
          new=$(bar < paper/web/data.js)
          old=$(curl -fsS "$LIVE" | bar || echo none)
          echo "線上最後 K 線 $old，這次算出 $new"
          if [ "$new" != "$old" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.changed == 'true'
        with:
          path: paper/web
      - name: 保存操作指令紀錄（有新指令才提交推回）
        id: save
        if: steps.state.outcome == 'success'
        continue-on-error: true
        working-directory: paper/state
        run: |
          if [ -z "$(git status --porcelain -- signals_log.csv)" ]; then
            echo "沒有新的操作指令，不需提交"
          else
            git add signals_log.csv
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "操作指令 $(TZ=Asia/Taipei date '+%F %H:%M')（run ${{ github.run_id }}）"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            git log -1 --format='已推送 %h %s'
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  log-check:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.log_saved != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 操作指令紀錄沒有存到
        run: |
          echo "::error::操作指令紀錄沒有存到 btc-backtest-state（見 build 的「取回／保存操作指令紀錄」步驟）；網站照常發布"
          exit 1
